spring.application.name=backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/jansetu}
spring.datasource.username=${DATABASE_USERNAME:rupeshtripathi}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

application.security.jwt.secret-key=${JWT_SECRET_KEY:jansetu-local-dev-jwt-secret-key-min-32-chars-ok}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}
application.security.bootstrap-admin.email=${JANSETU_ADMIN_EMAIL:admin@jansetu.gov.in}
application.security.bootstrap-admin.password=${JANSETU_ADMIN_PASSWORD:}
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.mvc.pathmatch.matching-strategy=ant_path_matcher




# Gemini Configuration (Using OpenAI Compatibility)
spring.ai.openai.api-key=${GEMINI_API_KEY:disabled}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.chat.options.model=gemini-3.6-flash

# Local grounded answers are the safe default. Enable only after obtaining
# informed consent and configuring an approved provider budget.
jansetu.ai.provider-enabled=${JANSETU_AI_PROVIDER_ENABLED:false}

# Policy investigations use bounded, persisted tool execution. The deterministic
# mode remains the default so local development and CI never require paid model access.
jansetu.agent.max-tool-calls=${JANSETU_AGENT_MAX_TOOL_CALLS:12}
jansetu.agent.max-duration-seconds=${JANSETU_AGENT_MAX_DURATION_SECONDS:30}
jansetu.agent.max-model-calls=${JANSETU_AGENT_MAX_MODEL_CALLS:12}
jansetu.agent.max-estimated-tokens=${JANSETU_AGENT_MAX_ESTIMATED_TOKENS:6000}

# Only explicitly approved authorities can be contacted for evidence capture. Source
# retrieval rejects redirects, private IPs, non-standard ports, unexpected media types,
# and payloads larger than this bounded limit.
jansetu.sources.allowed-hosts=${JANSETU_SOURCE_ALLOWED_HOSTS:mahadbt.maharashtra.gov.in,pmkisan.gov.in,india.gov.in}
jansetu.sources.max-content-bytes=${JANSETU_SOURCE_MAX_CONTENT_BYTES:524288}
jansetu.sources.request-timeout-seconds=${JANSETU_SOURCE_REQUEST_TIMEOUT_SECONDS:10}
