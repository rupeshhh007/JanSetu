spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/jansetu
spring.datasource.username=rupeshtripathi
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}
spring.mvc.pathmatch.matching-strategy=ant_path_matcher




# Groq Configuration (Using OpenAI Compatibility)

# Groq via OpenAI Compatibility
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.1-8b-instant
spring.ai.openai.chat.options.temperature=0.7