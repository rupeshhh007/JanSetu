# Dedicated production runtime profile; never rely on local development defaults.
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION:14400000}
application.security.bootstrap-admin.email=${JANSETU_ADMIN_EMAIL:admin@jansetu.example}
application.security.bootstrap-admin.password=${JANSETU_ADMIN_PASSWORD:}
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# API documentation is intended for local development and internal testing.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# The model remains disabled by default; never put Gemini secrets in client variables.
jansetu.ai.provider-enabled=${JANSETU_AI_PROVIDER_ENABLED:false}
