# Keep tests isolated from a developer's local database. The JSON column uses
# Hibernate's type mapping, while Flyway migration compatibility is exercised
# against PostgreSQL in deployment/CI.
spring.datasource.url=jdbc:h2:mem:jansetu;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# --- Security/JWT Configuration (Required to prevent NullPointerExceptions in Tests) ---
application.security.jwt.secret-key=dummy-test-key-that-is-at-least-32-chars-long-to-pass-validation
application.security.jwt.expiration=3600000

# --- Optional: Suppress warnings for cleaner logs ---
spring.jpa.open-in-view=true
spring.ai.openai.api-key=test-key
spring.ai.openai.base-url=http://localhost:9999
