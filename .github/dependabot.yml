# Batch routine updates weekly; keep security alerts and security PRs enabled.
# Major-version migrations need deliberate compatibility work and their own PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      routine-npm:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels:
      - dependencies

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      routine-maven:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:45"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      routine-actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels:
      - dependencies
